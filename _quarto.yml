project:
  type: website
  output-dir: docs
  # ⚠ Load-bearing. Without an explicit render list, Quarto renders every .qmd
  # AND .md in the project — including handoff.md, which produced a publishable
  # docs/handoff.html on 2026-08-09. .gitignore excludes the handoff SOURCE, but
  # docs/ is committed on purpose (Pages serves from it), so `git add -A` would
  # have published the working notes. Gitignoring the source is not enough; the
  # build has to not produce it. Only .qmd renders now.
  render:
    - "**/*.qmd"
    - "!handoff.md"
  # Both must land in docs/ on every render; Quarto only copies root files
  # listed here. CNAME sets the custom domain. .nojekyll stops GitHub running
  # Jekyll over the output (plain `quarto render` does not create it).
  resources:
    - CNAME
    - .nojekyll

website:
  title: "Joel Winkelman"
  description: "Joel Winkelman is Assistant Professor of Government and Public Policy at Hamilton College."
  site-url: "https://joelwinkelman.com"
  navbar:
    left:
      - href: index.qmd
        text: About
      - href: research.qmd
        text: Research
      - href: work-in-progress.qmd
        text: Work in Progress
      - href: teaching.qmd
        text: Teaching
      - href: cv.qmd
        text: CV
  page-footer:
    center: "© 2026 Joel Winkelman"

format:
  html:
    theme: cosmo
    css: styles.css
    toc: false
    anchor-sections: false
